services:
  postgres:
    image: postgres:16-alpine
    container_name: aerocast-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: airpollution
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: aerocast-ai-service
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/airpollution
      - MODEL_ARTIFACTS_DIR=./artifacts
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: aerocast-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/airpollution
      - PORT=5000
      - AI_SERVICE_URL=http://ai-service:8000
      - FRONTEND_URL=http://localhost:5173
      - ADMIN_TOKEN=secret_admin_token_aerocast
      - NODE_ENV=production
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: aerocast-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
